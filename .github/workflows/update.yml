name: Update Weather Dashboard

on:
  schedule:
    # UTC 기준: 22:00 = 한국시간 아침 07:00 / 10:00 = 한국시간 저녁 19:00
    - cron: '0 22,10 * * *'
  workflow_dispatch: # 폰이나 PC에서 수동 실행 버튼 활성화

permissions:
  contents: write # 생성된 index.html과 이미지를 저장소에 자동 저장하기 위한 권한

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 저장소 불러오기
        uses: actions/checkout@v4

      - name: 파이썬 세팅
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Selenium 설치
        run: pip install selenium

      - name: 날씨 수집 및 홈페이지 생성
        run: python main.py

      - name: 결과물 저장 및 배포
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html images/
          git diff --quiet && git diff --staged --quiet || (git commit -m "Update weather data" && git push)
